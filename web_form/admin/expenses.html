<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses — BatchFee Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="logo">Batch<span style="font-weight:400;opacity:0.6;">Fee</span></div><div class="institute-name" id="sidebarInstituteName">Loading...</div></div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="sidebarUserAvatar">A</div><div class="user-details"><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role" id="sidebarUserRole">Loading...</div></div><button class="logout-btn" onclick="logoutUser()">Logout</button></div></div>
        </aside>
        <main class="main-content">
            <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <div class="page-header"><h1>Expenses</h1><p>Track institute expenses.</p></div>
            <div class="page-actions">
                <div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="Search by title or category..." oninput="filterExpenses()"></div>
                <button class="btn btn-primary" onclick="openAddExpense()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Expense</button>
            </div>
            <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
                <div class="stat-card"><div class="stat-icon rose">💸</div><div class="stat-info"><h3 id="totalExpenses">—</h3><p>Total Expenses</p></div></div>
                <div class="stat-card"><div class="stat-icon amber">📅</div><div class="stat-info"><h3 id="monthExpenses">—</h3><p>This Month</p></div></div>
                <div class="stat-card"><div class="stat-icon purple">📊</div><div class="stat-info"><h3 id="avgExpense">—</h3><p>Avg per Expense</p></div></div>
            </div>
            <div class="card"><div class="table-container"><table><thead><tr><th>Title</th><th>Category</th><th>Amount</th><th>Method</th><th>Date</th><th>Actions</th></tr></thead><tbody id="expensesTable"><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--gray-400);">Loading expenses...</td></tr></tbody></table></div></div>
        </main>
    </div>

    <div class="modal-overlay" id="addModal"><div class="modal" style="max-width:480px;"><h3>➕ Add Expense</h3><form id="addForm"><div class="form-group"><label>Title <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="addTitle" required></div><div class="form-row"><div class="form-group"><label>Category</label><select class="form-input" id="addCategory"><option>Utilities</option><option>Salary</option><option>Rent</option><option>Stationery</option><option>Maintenance</option><option>Marketing</option><option>Transport</option><option>Food</option><option>Other</option></select></div><div class="form-group"><label>Amount (৳) <span style="color:var(--danger);">*</span></label><input type="number" class="form-input" id="addAmount" min="0" required></div></div><div class="form-row"><div class="form-group"><label>Payment Method</label><select class="form-input" id="addMethod"><option>Cash</option><option>Bank</option><option>Mobile</option></select></div><div class="form-group"><label>Date</label><input type="date" class="form-input" id="addDate"></div></div><div class="form-group"><label>Description</label><textarea class="form-input" id="addDescription" rows="2"></textarea></div><div class="modal-actions" style="margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button><button type="submit" class="btn btn-primary">Add Expense</button></div></form></div></div>
    <div class="modal-overlay" id="editModal"><div class="modal" style="max-width:480px;"><h3>✏️ Edit Expense</h3><form id="editForm"><div class="form-group"><label>Title</label><input type="text" class="form-input" id="editTitle"></div><div class="form-row"><div class="form-group"><label>Category</label><select class="form-input" id="editCategory"><option>Utilities</option><option>Salary</option><option>Rent</option><option>Stationery</option><option>Maintenance</option><option>Marketing</option><option>Transport</option><option>Food</option><option>Other</option></select></div><div class="form-group"><label>Amount</label><input type="number" class="form-input" id="editAmount" min="0"></div></div><div class="form-row"><div class="form-group"><label>Method</label><select class="form-input" id="editMethod"><option>Cash</option><option>Bank</option><option>Mobile</option></select></div><div class="form-group"><label>Date</label><input type="date" class="form-input" id="editDate"></div></div><div class="form-group"><label>Description</label><textarea class="form-input" id="editDescription" rows="2"></textarea></div><div class="modal-actions" style="margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
    <div class="modal-overlay" id="deleteModal"><div class="modal"><h3>🗑️ Delete Expense</h3><p>Are you sure you want to delete this expense?</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button><button class="btn btn-danger" onclick="confirmDeleteExpense()">Delete</button></div></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/sidebar-nav.js"></script>

    <script>
        let session, allItems=[], selectedId=null;
        document.addEventListener('DOMContentLoaded',async function(){try{session=await requireAuth();updateSidebarUser(session);if(session.instituteId)loadItems();else document.querySelector('.card').innerHTML='<p style="text-align:center;padding:40px;color:var(--gray-500);">Institute not linked.</p>';}catch(e){}});

        async function loadItems(){try{const snap=await db.collection('institutes').doc(session.instituteId).collection('expenses').orderBy('createdAtMs','desc').get();allItems=[];snap.forEach(d=>allItems.push({id:d.id,...d.data()}));renderItems();calcStats()}catch(e){document.getElementById('expensesTable').innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:24px;">Failed to load expenses.</td></tr>';}}

        function calcStats(){const total=allItems.reduce((s,i)=>s+(i.amount||0),0);const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');const monthTotal=allItems.filter(i=>i.createdAtMs&&new Date(i.createdAtMs).toISOString().substring(0,7)===ym).reduce((s,i)=>s+(i.amount||0),0);const avg=allItems.length?Math.round(total/allItems.length):0;document.getElementById('totalExpenses').textContent='৳'+total.toLocaleString();document.getElementById('monthExpenses').textContent='৳'+monthTotal.toLocaleString();document.getElementById('avgExpense').textContent='৳'+avg.toLocaleString();}

        function renderItems(){const tbody=document.getElementById('expensesTable');const q=document.getElementById('searchInput').value.toLowerCase().trim();let f=allItems;if(q)f=allItems.filter(i=>(i.title||'').toLowerCase().includes(q)||(i.category||'').toLowerCase().includes(q));if(!f.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:32px;"><div class="empty-state"><div class="empty-icon">💸</div><h3>No expenses found</h3><p>'+(q?'Try a different search.':'Click "Add Expense" to record one.')+'</p></div></td></tr>';return;}
        tbody.innerHTML=f.map(i=>`<tr><td><strong>${esc(i.title||'—')}</strong>${i.description?'<br><span style="font-size:11px;color:var(--gray-400);">'+esc(i.description.substring(0,50))+'</span>':''}</td><td><span class="badge badge-subject">${esc(i.category||'Other')}</span></td><td><strong style="color:var(--danger);">৳${(i.amount||0).toLocaleString()}</strong></td><td>${esc(i.paymentMethod||'—')}</td><td>${i.createdAtMs?fmt(i.createdAtMs):'—'}</td><td><button class="btn btn-sm btn-outline" onclick="openEdit('${i.id.replace(/'/g,"\\'")}')">Edit</button><button class="btn btn-sm btn-danger" onclick="openDelete('${i.id.replace(/'/g,"\\'")}')">Delete</button></td></tr>`).join('');}

        function filterExpenses(){renderItems();}
        function openAddExpense(){document.getElementById('addForm').reset();const t=new Date().toISOString().split('T')[0];document.getElementById('addDate').value=t;document.getElementById('addModal').classList.add('show');}
        document.getElementById('addForm').addEventListener('submit',async function(e){e.preventDefault();if(!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Adding...';try{const d={title:document.getElementById('addTitle').value.trim(),category:document.getElementById('addCategory').value,amount:parseFloat(document.getElementById('addAmount').value)||0,paymentMethod:document.getElementById('addMethod').value,expenseDate:document.getElementById('addDate').value||null,description:document.getElementById('addDescription').value.trim(),createdAtMs:Date.now()};const ref=await db.collection('institutes').doc(session.instituteId).collection('expenses').add(d);allItems.unshift({id:ref.id,...d});closeModal('addModal');renderItems();calcStats();showToast('✅ Expense added!','success');}catch(e){showToast('Failed to add expense.','error');}finally{btn.disabled=false;btn.textContent='Add Expense';}});

        function openEdit(id){selectedId=id;const i=allItems.find(x=>x.id===id);if(!i)return;document.getElementById('editTitle').value=i.title||'';document.getElementById('editCategory').value=i.category||'Other';document.getElementById('editAmount').value=i.amount||'';document.getElementById('editMethod').value=i.paymentMethod||'Cash';document.getElementById('editDate').value=i.expenseDate||'';document.getElementById('editDescription').value=i.description||'';document.getElementById('editModal').classList.add('show');}
        document.getElementById('editForm').addEventListener('submit',async function(e){e.preventDefault();if(!selectedId||!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Saving...';try{const u={title:document.getElementById('editTitle').value.trim(),category:document.getElementById('editCategory').value,amount:parseFloat(document.getElementById('editAmount').value)||0,paymentMethod:document.getElementById('editMethod').value,expenseDate:document.getElementById('editDate').value||null,description:document.getElementById('editDescription').value.trim()};await db.collection('institutes').doc(session.instituteId).collection('expenses').doc(selectedId).update(u);const idx=allItems.findIndex(x=>x.id===selectedId);if(idx!==-1)Object.assign(allItems[idx],u);closeModal('editModal');renderItems();calcStats();showToast('✅ Expense updated!','success');}catch(e){showToast('Failed to update.','error');}finally{btn.disabled=false;btn.textContent='Save';}});

        function openDelete(id){selectedId=id;document.getElementById('deleteModal').classList.add('show');}
        async function confirmDeleteExpense(){if(!selectedId||!session)return;const btn=document.querySelector('#deleteModal .btn-danger');btn.disabled=true;btn.textContent='Deleting...';try{await db.collection('institutes').doc(session.instituteId).collection('expenses').doc(selectedId).delete();allItems=allItems.filter(x=>x.id!==selectedId);closeModal('deleteModal');renderItems();calcStats();showToast('Expense deleted.','warning');}catch(e){showToast('Failed to delete.','error');}finally{btn.disabled=false;btn.textContent='Delete';}}

        function closeModal(id){document.getElementById(id).classList.remove('show');selectedId=null;}
        function showToast(m,t){const c=document.getElementById('toastContainer');const o=document.createElement('div');o.className='toast '+t;o.textContent=m;c.appendChild(o);setTimeout(()=>o.remove(),4000);}
        function fmt(ms){return new Date(ms).toLocaleDateString('en-BD',{day:'numeric',month:'short',year:'numeric'});}
        function esc(str){if(!str)return '—';const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
    </script>
</body>
</html>
