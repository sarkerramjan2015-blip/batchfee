<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Enquiries — BatchFee Admin</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-wrapper"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo">Batch<span style="font-weight:400;opacity:0.6;">Fee</span></div><div class="institute-name" id="sidebarInstituteName">Loading...</div></div><nav class="sidebar-nav" id="sidebarNav"></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="sidebarUserAvatar">A</div><div class="user-details"><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role" id="sidebarUserRole">Loading...</div></div><button class="logout-btn" onclick="logoutUser()">Logout</button></div></div></aside>
<main class="main-content"><button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="page-header"><h1>Enquiries</h1><p>Track student enquiries and follow-ups.</p></div>
<div class="page-actions"><div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="Search by name or phone..." oninput="filterEnquiries()"><select class="filter-select" id="statusFilter" onchange="filterEnquiries()"><option value="all">All Status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="converted">Converted</option><option value="closed">Closed</option></select></div><button class="btn btn-primary" onclick="openAddEnquiry()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Enquiry</button></div>
<div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;"><div class="stat-card"><div class="stat-icon blue">🆕</div><div class="stat-info"><h3 id="statNew">—</h3><p>New</p></div></div><div class="stat-card"><div class="stat-icon amber">📞</div><div class="stat-info"><h3 id="statContacted">—</h3><p>Contacted</p></div></div><div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-info"><h3 id="statConverted">—</h3><p>Converted</p></div></div><div class="stat-card"><div class="stat-icon rose">📊</div><div class="stat-info"><h3 id="statTotal">—</h3><p>Total</p></div></div></div>
<div class="card"><div class="table-container"><table><thead><tr><th>Name</th><th>Phone</th><th>Class Interest</th><th>Guardian</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody id="enquiriesTable"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--gray-400);">Loading enquiries...</td></tr></tbody></table></div></div>
</main></div>

<div class="modal-overlay" id="addModal"><div class="modal" style="max-width:480px;"><h3>➕ Add Enquiry</h3><form id="addForm"><div class="form-group"><label>Student Name <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="addName" required></div><div class="form-row"><div class="form-group"><label>Phone <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="addPhone" required></div><div class="form-group"><label>Guardian Name</label><input type="text" class="form-input" id="addGuardian"></div></div><div class="form-row"><div class="form-group"><label>Class Interest</label><input type="text" class="form-input" id="addClass" placeholder="e.g. HSC 1st Year"></div><div class="form-group"><label>Status</label><select class="form-input" id="addStatus"><option value="new">New</option><option value="contacted">Contacted</option><option value="converted">Converted</option><option value="closed">Closed</option></select></div></div><div class="form-group"><label>Notes</label><textarea class="form-input" id="addNotes" rows="2"></textarea></div><div class="modal-actions" style="margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button><button type="submit" class="btn btn-primary">Add Enquiry</button></div></form></div></div>
<div class="modal-overlay" id="editModal"><div class="modal" style="max-width:480px;"><h3>✏️ Update Enquiry</h3><form id="editForm"><div class="form-group"><label>Student Name</label><input type="text" class="form-input" id="editName"></div><div class="form-row"><div class="form-group"><label>Phone</label><input type="text" class="form-input" id="editPhone"></div><div class="form-group"><label>Guardian</label><input type="text" class="form-input" id="editGuardian"></div></div><div class="form-row"><div class="form-group"><label>Class Interest</label><input type="text" class="form-input" id="editClass"></div><div class="form-group"><label>Status</label><select class="form-input" id="editStatus"><option value="new">New</option><option value="contacted">Contacted</option><option value="converted">Converted</option><option value="closed">Closed</option></select></div></div><div class="form-group"><label>Notes</label><textarea class="form-input" id="editNotes" rows="3"></textarea></div><div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<div class="modal-overlay" id="deleteModal"><div class="modal"><h3>🗑️ Delete Enquiry</h3><p>Are you sure?</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button><button class="btn btn-danger" onclick="confirmDeleteEnquiry()">Delete</button></div></div></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth-check.js"></script>
<script src="../js/sidebar-nav.js"></script>

<script>
let session, allItems=[], selectedId=null;
document.addEventListener('DOMContentLoaded',async function(){try{session=await requireAuth();updateSidebarUser(session);if(session.instituteId)loadItems();else document.querySelector('.card').innerHTML='<p style="text-align:center;padding:40px;color:var(--gray-500);">Institute not linked.</p>';}catch(e){}});

async function loadItems(){try{const snap=await db.collection('institutes').doc(session.instituteId).collection('enquiries').orderBy('createdAtMs','desc').get();allItems=[];snap.forEach(d=>allItems.push({id:d.id,...d.data()}));renderItems()}catch(e){document.getElementById('enquiriesTable').innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--danger);padding:24px;">Failed to load enquiries.</td></tr>';}}

function renderItems(){const tbody=document.getElementById('enquiriesTable');const q=document.getElementById('searchInput').value.toLowerCase().trim();const sf=document.getElementById('statusFilter').value;let f=allItems;if(q)f=f.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.phone||'').includes(q));if(sf!=='all')f=f.filter(i=>i.status===sf);if(!f.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;"><div class="empty-state"><div class="empty-icon">📞</div><h3>No enquiries found</h3><p>'+(q?'Try a different search.':'Click "Add Enquiry" to add one.')+'</p></div></td></tr>';return;}
const counts={new:0,contacted:0,converted:0};allItems.forEach(i=>{if(counts[i.status]!==undefined)counts[i.status]++;});document.getElementById('statNew').textContent=counts.new;document.getElementById('statContacted').textContent=counts.contacted;document.getElementById('statConverted').textContent=counts.converted;document.getElementById('statTotal').textContent=allItems.length;
tbody.innerHTML=f.map(i=>{const st=i.status||'new';const lbl={new:'🆕 New',contacted:'📞 Contacted',converted:'✅ Converted',closed:'❌ Closed'}[st]||st;const cls={new:'pending',contacted:'pending',converted:'active',closed:'inactive'}[st]||'pending';return`<tr><td><strong>${esc(i.name||'—')}</strong></td><td>${esc(i.phone||'—')}</td><td>${esc(i.classInterest||'—')}</td><td>${esc(i.guardianName||'—')}</td><td><span class="status-badge ${cls}">${lbl}</span></td><td>${i.createdAtMs?fmt(i.createdAtMs):'—'}</td><td><button class="btn btn-sm btn-outline" onclick="openEdit('${i.id.replace(/'/g,"\\'")}')">Edit</button><button class="btn btn-sm btn-danger" onclick="openDelete('${i.id.replace(/'/g,"\\'")}')">Delete</button></td></tr>`;}).join('');}
function filterEnquiries(){renderItems();}

function openAddEnquiry(){document.getElementById('addForm').reset();document.getElementById('addStatus').value='new';document.getElementById('addModal').classList.add('show');}
document.getElementById('addForm').addEventListener('submit',async function(e){e.preventDefault();if(!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Adding...';try{const d={name:document.getElementById('addName').value.trim(),phone:document.getElementById('addPhone').value.trim(),guardianName:document.getElementById('addGuardian').value.trim(),classInterest:document.getElementById('addClass').value.trim(),status:document.getElementById('addStatus').value,notes:document.getElementById('addNotes').value.trim(),createdAtMs:Date.now()};const ref=await db.collection('institutes').doc(session.instituteId).collection('enquiries').add(d);allItems.unshift({id:ref.id,...d});closeModal('addModal');renderItems();showToast('✅ Enquiry added!','success');}catch(e){showToast('Failed to add.','error');}finally{btn.disabled=false;btn.textContent='Add Enquiry';}});

function openEdit(id){selectedId=id;const i=allItems.find(x=>x.id===id);if(!i)return;document.getElementById('editName').value=i.name||'';document.getElementById('editPhone').value=i.phone||'';document.getElementById('editGuardian').value=i.guardianName||'';document.getElementById('editClass').value=i.classInterest||'';document.getElementById('editStatus').value=i.status||'new';document.getElementById('editNotes').value=i.notes||'';document.getElementById('editModal').classList.add('show');}
document.getElementById('editForm').addEventListener('submit',async function(e){e.preventDefault();if(!selectedId||!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Saving...';try{const u={name:document.getElementById('editName').value.trim(),phone:document.getElementById('editPhone').value.trim(),guardianName:document.getElementById('editGuardian').value.trim(),classInterest:document.getElementById('editClass').value.trim(),status:document.getElementById('editStatus').value,notes:document.getElementById('editNotes').value.trim()};await db.collection('institutes').doc(session.instituteId).collection('enquiries').doc(selectedId).update(u);const idx=allItems.findIndex(x=>x.id===selectedId);if(idx!==-1)Object.assign(allItems[idx],u);closeModal('editModal');renderItems();showToast('✅ Enquiry updated!','success');}catch(e){showToast('Failed to update.','error');}finally{btn.disabled=false;btn.textContent='Save';}});

function openDelete(id){selectedId=id;document.getElementById('deleteModal').classList.add('show');}
async function confirmDeleteEnquiry(){if(!selectedId||!session)return;try{await db.collection('institutes').doc(session.instituteId).collection('enquiries').doc(selectedId).delete();allItems=allItems.filter(x=>x.id!==selectedId);closeModal('deleteModal');renderItems();showToast('Enquiry deleted.','warning');}catch(e){showToast('Failed to delete.','error');}}

function closeModal(id){document.getElementById(id).classList.remove('show');selectedId=null;}
function showToast(m,t){const c=document.getElementById('toastContainer');const o=document.createElement('div');o.className='toast '+t;o.textContent=m;c.appendChild(o);setTimeout(()=>o.remove(),4000);}
function fmt(ms){return new Date(ms).toLocaleDateString('en-BD',{day:'numeric',month:'short',year:'numeric'});}
function esc(str){if(!str)return '—';const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
</script></body></html>
