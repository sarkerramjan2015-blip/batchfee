<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff — BatchFee Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">Batch<span style="font-weight:400;opacity:0.6;">Fee</span></div>
                <div class="institute-name" id="sidebarInstituteName">Loading...</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="sidebarUserAvatar">A</div>
                    <div class="user-details">
                        <div class="user-name" id="sidebarUserName">Admin</div>
                        <div class="user-role" id="sidebarUserRole">Loading...</div>
                    </div>
                    <button class="logout-btn" onclick="logoutUser()">Logout</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <div class="page-header">
                <h1>Staff Management</h1>
                <p>Manage teachers and staff members.</p>
            </div>

            <div class="page-actions">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search by name or role..." oninput="filterStaff()">
                </div>
                <button class="btn btn-primary" onclick="openAddStaff()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Staff
                </button>
            </div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Subjects</th>
                                <th>Salary</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staffTable">
                            <tr><td colspan="7" style="text-align:center;color:var(--gray-400);padding:24px;">Loading staff...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Staff Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal" style="max-width:500px;">
            <h3>➕ Add Staff</h3>
            <form id="addStaffForm">
                <div class="form-group">
                    <label>Full Name <span style="color:var(--danger);">*</span></label>
                    <input type="text" class="form-input" id="addName" placeholder="Enter full name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" class="form-input" id="addPhone" placeholder="+8801XXXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-input" id="addEmail" placeholder="email@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Role</label>
                        <select class="form-input" id="addRole">
                            <option value="Teacher">Teacher</option>
                            <option value="Accountant">Accountant</option>
                            <option value="Admin Staff">Admin Staff</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary (৳)</label>
                        <input type="number" class="form-input" id="addSalary" placeholder="25000" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subjects (comma separated)</label>
                    <input type="text" class="form-input" id="addSubjects" placeholder="e.g. Math, Physics, English">
                </div>
                <div class="modal-actions" style="margin-top:16px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Staff</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Staff Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal" style="max-width:500px;">
            <h3>✏️ Edit Staff</h3>
            <form id="editStaffForm">
                <div class="form-group">
                    <label>Full Name <span style="color:var(--danger);">*</span></label>
                    <input type="text" class="form-input" id="editName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" class="form-input" id="editPhone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-input" id="editEmail">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Role</label>
                        <select class="form-input" id="editRole">
                            <option value="Teacher">Teacher</option>
                            <option value="Accountant">Accountant</option>
                            <option value="Admin Staff">Admin Staff</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary (৳)</label>
                        <input type="number" class="form-input" id="editSalary" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subjects (comma separated)</label>
                    <input type="text" class="form-input" id="editSubjects" placeholder="e.g. Math, Physics, English">
                </div>
                <div class="modal-actions" style="margin-top:16px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>🗑️ Remove Staff</h3>
            <p>Are you sure you want to remove <strong id="deleteStaffName">this staff member</strong>? This will set their status to inactive.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDeleteStaff()">Remove</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/sidebar-nav.js"></script>

    <script>
        let session = null;
        let allStaff = [];
        let selectedStaffId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                session = await requireAuth();
                updateSidebarUser(session);
                if (session.instituteId) {
                    loadStaff();
                } else {
                    document.querySelector('.card').innerHTML = '<div class="card" style="text-align:center;padding:40px;"><p style="color:var(--gray-500);">Institute not linked.</p></div>';
                }
            } catch (err) {}
        });

        async function loadStaff() {
            const tbody = document.getElementById('staffTable');
            try {
                const snap = await db.collection('institutes')
                    .doc(session.instituteId)
                    .collection('staffs')
                    .orderBy('createdAtMs', 'desc')
                    .get();

                allStaff = [];
                snap.forEach(doc => allStaff.push({ id: doc.id, ...doc.data() }));
                renderStaff();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--danger);padding:24px;">Failed to load staff.</td></tr>';
            }
        }

        function renderStaff() {
            const tbody = document.getElementById('staffTable');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = allStaff;
            if (search) {
                filtered = allStaff.filter(s => {
                    const name = (s.name || '').toLowerCase();
                    const role = (s.role || '').toLowerCase();
                    return name.includes(search) || role.includes(search);
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;">' +
                    '<div class="empty-state"><div class="empty-icon">👤</div><h3>No staff found</h3>' +
                    '<p>' + (search ? 'Try a different search term.' : 'Click "Add Staff" to add one.') + '</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(s => {
                const isActive = s.status !== 'inactive';
                const subjects = Array.isArray(s.subjects) ? s.subjects : [];
                return `<tr>
                    <td><strong>${esc(s.name || '—')}</strong></td>
                    <td>${esc(s.phone || '—')}</td>
                    <td>${esc(s.role || '—')}</td>
                    <td>${subjects.length ? subjects.map(sub => `<span class="badge badge-subject">${esc(sub.trim())}</span>`).join(' ') : '—'}</td>
                    <td>${s.salary ? '৳' + s.salary.toLocaleString() : '—'}</td>
                    <td><span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? '✅ Active' : '⛔ Inactive'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="openEditStaff('${s.id.replace(/'/g, "\\'")}')">Edit</button>
                        <button class="btn btn-sm ${isActive ? 'btn-outline' : 'btn-success'}" onclick="toggleStaffStatus('${s.id.replace(/'/g, "\\'")}')">${isActive ? 'Deactivate' : 'Activate'}</button>
                        <button class="btn btn-sm btn-danger" onclick="openDeleteStaff('${s.id.replace(/'/g, "\\'")}')">Remove</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function filterStaff() {
            renderStaff();
        }

        function openAddStaff() {
            document.getElementById('addStaffForm').reset();
            document.getElementById('addModal').classList.add('show');
        }

        document.getElementById('addStaffForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!session) return;

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Adding...';

            try {
                const subjectsRaw = document.getElementById('addSubjects').value.trim();
                const staffData = {
                    name: document.getElementById('addName').value.trim(),
                    phone: document.getElementById('addPhone').value.trim(),
                    email: document.getElementById('addEmail').value.trim(),
                    role: document.getElementById('addRole').value,
                    salary: parseFloat(document.getElementById('addSalary').value) || 0,
                    subjects: subjectsRaw ? subjectsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
                    status: 'active',
                    createdAtMs: Date.now(),
                    updatedAtMs: Date.now()
                };

                const docRef = await db.collection('institutes')
                    .doc(session.instituteId)
                    .collection('staffs')
                    .add(staffData);

                allStaff.unshift({ id: docRef.id, ...staffData });
                closeModal('addModal');
                renderStaff();
                showToast('✅ Staff added successfully!', 'success');
            } catch (err) {
                console.error('Add error:', err);
                showToast('Failed to add staff.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Add Staff';
            }
        });

        function openEditStaff(id) {
            selectedStaffId = id;
            const s = allStaff.find(x => x.id === id);
            if (!s) return;

            document.getElementById('editName').value = s.name || '';
            document.getElementById('editPhone').value = s.phone || '';
            document.getElementById('editEmail').value = s.email || '';
            document.getElementById('editRole').value = s.role || 'Teacher';
            document.getElementById('editSalary').value = s.salary || '';
            document.getElementById('editSubjects').value = Array.isArray(s.subjects) ? s.subjects.join(', ') : '';
            document.getElementById('editModal').classList.add('show');
        }

        document.getElementById('editStaffForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!selectedStaffId || !session) return;

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const subjectsRaw = document.getElementById('editSubjects').value.trim();
                const updateData = {
                    name: document.getElementById('editName').value.trim(),
                    phone: document.getElementById('editPhone').value.trim(),
                    email: document.getElementById('editEmail').value.trim(),
                    role: document.getElementById('editRole').value,
                    salary: parseFloat(document.getElementById('editSalary').value) || 0,
                    subjects: subjectsRaw ? subjectsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
                    updatedAtMs: Date.now()
                };

                await db.collection('institutes')
                    .doc(session.instituteId)
                    .collection('staffs')
                    .doc(selectedStaffId)
                    .update(updateData);

                const idx = allStaff.findIndex(x => x.id === selectedStaffId);
                if (idx !== -1) Object.assign(allStaff[idx], updateData);

                closeModal('editModal');
                renderStaff();
                showToast('✅ Staff updated!', 'success');
            } catch (err) {
                console.error('Edit error:', err);
                showToast('Failed to update staff.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        });

        async function toggleStaffStatus(id) {
            if (!session) return;
            const s = allStaff.find(x => x.id === id);
            if (!s) return;

            const newStatus = s.status === 'inactive' ? 'active' : 'inactive';
            try {
                await db.collection('institutes')
                    .doc(session.instituteId)
                    .collection('staffs')
                    .doc(id)
                    .update({ status: newStatus, updatedAtMs: Date.now() });

                s.status = newStatus;
                renderStaff();
                showToast(newStatus === 'active' ? '✅ Staff activated!' : '⛔ Staff deactivated.', 'warning');
            } catch (err) {
                console.error(err);
                showToast('Failed to toggle status.', 'error');
            }
        }

        function openDeleteStaff(id) {
            selectedStaffId = id;
            const s = allStaff.find(x => x.id === id);
            document.getElementById('deleteStaffName').textContent = s ? esc(s.name || 'this staff') : 'this staff';
            document.getElementById('deleteModal').classList.add('show');
        }

        async function confirmDeleteStaff() {
            if (!selectedStaffId || !session) return;

            const btn = document.querySelector('#deleteModal .btn-danger');
            btn.disabled = true;
            btn.textContent = 'Removing...';

            try {
                await db.collection('institutes')
                    .doc(session.instituteId)
                    .collection('staffs')
                    .doc(selectedStaffId)
                    .update({ status: 'inactive', updatedAtMs: Date.now() });

                const s = allStaff.find(x => x.id === selectedStaffId);
                if (s) s.status = 'inactive';

                closeModal('deleteModal');
                renderStaff();
                showToast('Staff removed.', 'warning');
            } catch (err) {
                console.error(err);
                showToast('Failed to remove staff.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Remove';
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function esc(str) {
            if (!str) return '—';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }
    </script>
</body>
</html>
