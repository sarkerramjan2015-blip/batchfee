<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exams — BatchFee Admin</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-wrapper"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo">Batch<span style="font-weight:400;opacity:0.6;">Fee</span></div><div class="institute-name" id="sidebarInstituteName">Loading...</div></div><nav class="sidebar-nav" id="sidebarNav"></nav><div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="sidebarUserAvatar">A</div><div class="user-details"><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role" id="sidebarUserRole">Loading...</div></div><button class="logout-btn" onclick="logoutUser()">Logout</button></div></div></aside>
<main class="main-content"><button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="page-header"><h1>Exams & Results</h1><p>Create exams and manage results.</p></div>
<div class="page-actions"><div class="search-bar"><input type="text" class="search-input" id="searchInput" placeholder="Search exams..." oninput="filterExams()"></div><button class="btn btn-primary" onclick="openAddExam()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Create Exam</button></div>
<div class="card"><div class="table-container"><table><thead><tr><th>Exam Name</th><th>Batch</th><th>Date</th><th>Max Marks</th><th>Results</th><th>Status</th><th>Actions</th></tr></thead><tbody id="examsTable"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--gray-400);">Loading exams...</td></tr></tbody></table></div></div>
</main></div>

<div class="modal-overlay" id="addModal"><div class="modal" style="max-width:480px;"><h3>➕ Create Exam</h3><form id="addForm"><div class="form-group"><label>Exam Name <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="addName" required></div><div class="form-group"><label>Batch <span style="color:var(--danger);">*</span></label><select class="form-input" id="addBatch" required><option value="">Select batch...</option></select></div><div class="form-row"><div class="form-group"><label>Date</label><input type="date" class="form-input" id="addDate"></div><div class="form-group"><label>Max Marks</label><input type="number" class="form-input" id="addMaxMarks" min="0" value="100"></div></div><div class="form-group"><label>Description</label><textarea class="form-input" id="addDescription" rows="2"></textarea></div><div class="modal-actions" style="margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button><button type="submit" class="btn btn-primary">Create Exam</button></div></form></div></div>
<div class="modal-overlay" id="editModal"><div class="modal" style="max-width:480px;"><h3>✏️ Edit Exam</h3><form id="editForm"><div class="form-group"><label>Name</label><input type="text" class="form-input" id="editName"></div><div class="form-group"><label>Batch</label><select class="form-input" id="editBatch"><option value="">Select batch...</option></select></div><div class="form-row"><div class="form-group"><label>Date</label><input type="date" class="form-input" id="editDate"></div><div class="form-group"><label>Max Marks</label><input type="number" class="form-input" id="editMaxMarks" min="0"></div></div><div class="form-group"><label>Description</label><textarea class="form-input" id="editDescription" rows="2"></textarea></div><div class="modal-actions" style="margin-top:16px;"><button type="button" class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<div class="modal-overlay" id="resultModal"><div class="modal" style="max-width:560px;"><h3>📝 Enter Results</h3><p style="font-size:13px;color:var(--gray-500);margin-bottom:12px;" id="resultExamInfo"></p><div id="resultList" style="max-height:350px;overflow-y:auto;"></div><div class="modal-actions" style="margin-top:16px;justify-content:space-between;"><button class="btn btn-outline" onclick="closeModal('resultModal')">Close</button><button class="btn btn-primary" onclick="saveResults()">Save Results</button></div></div></div>
<div class="modal-overlay" id="deleteModal"><div class="modal"><h3>🗑️ Delete Exam</h3><p>Are you sure? This will also delete all associated results.</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal('deleteModal')">Cancel</button><button class="btn btn-danger" onclick="confirmDeleteExam()">Delete</button></div></div></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth-check.js"></script>
<script src="../js/sidebar-nav.js"></script>

<script>
let session, exams=[], batches=[], students=[], selectedId=null, editingResultExamId=null;
document.addEventListener('DOMContentLoaded',async function(){try{session=await requireAuth();updateSidebarUser(session);if(session.instituteId){await loadBatches();loadExams();}else document.querySelector('.card').innerHTML='<p style="text-align:center;padding:40px;color:var(--gray-500);">Institute not linked.</p>';}catch(e){}});

async function loadBatches(){try{const snap=await db.collection('institutes').doc(session.instituteId).collection('batches').where('status','==','active').get();batches=[];snap.forEach(d=>batches.push({id:d.id,...d.data()}));const html='<option value="">Select batch...</option>'+batches.map(b=>`<option value="${b.id}">${esc(b.name||'Unnamed')}</option>`).join('');document.getElementById('addBatch').innerHTML=html;document.getElementById('editBatch').innerHTML=html;}catch(e){}}
async function loadStudents(){try{const snap=await db.collection('institutes').doc(session.instituteId).collection('students').where('status','==','active').get();students=[];snap.forEach(d=>students.push({id:d.id,...d.data()}));}catch(e){}}

async function loadExams(){try{const snap=await db.collection('institutes').doc(session.instituteId).collection('exams').orderBy('createdAtMs','desc').get();exams=[];snap.forEach(d=>exams.push({id:d.id,...d.data()}));renderExams()}catch(e){document.getElementById('examsTable').innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--danger);padding:24px;">Failed to load exams.</td></tr>';}}

function renderExams(){const tbody=document.getElementById('examsTable');const q=document.getElementById('searchInput').value.toLowerCase().trim();let f=exams;if(q)f=exams.filter(e=>(e.name||'').toLowerCase().includes(q));if(!f.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;"><div class="empty-state"><div class="empty-icon">📝</div><h3>No exams found</h3><p>'+(q?'Try a different search.':'Click "Create Exam" to create one.')+'</p></div></td></tr>';return;}
tbody.innerHTML=f.map(e=>{const resultCount=e.resultCount||0;return`<tr><td><strong>${esc(e.name||'—')}</strong></td><td>${esc(e.batchName||'—')}</td><td>${e.examDate||'—'}</td><td>${e.maxMarks||'—'}</td><td>${resultCount}</td><td><span class="status-badge ${resultCount?'active':'pending'}">${resultCount?'✅ Done':'⏳ Pending'}</span></td><td><button class="btn btn-sm btn-outline" onclick="openAddResults('${e.id.replace(/'/g,"\\'")}')">📝 Results</button><button class="btn btn-sm btn-outline" onclick="openEditExam('${e.id.replace(/'/g,"\\'")}')">Edit</button><button class="btn btn-sm btn-danger" onclick="openDeleteExam('${e.id.replace(/'/g,"\\'")}')">Delete</button></td></tr>`;}).join('');}
function filterExams(){renderExams();}

function openAddExam(){document.getElementById('addForm').reset();document.getElementById('addDate').value=new Date().toISOString().split('T')[0];document.getElementById('addModal').classList.add('show');}
document.getElementById('addForm').addEventListener('submit',async function(e){e.preventDefault();if(!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Creating...';try{const batchId=document.getElementById('addBatch').value;const batch=batches.find(b=>b.id===batchId);await db.collection('institutes').doc(session.instituteId).collection('exams').add({name:document.getElementById('addName').value.trim(),batchId,batchName:batch?.name||'Unknown',examDate:document.getElementById('addDate').value||null,maxMarks:parseInt(document.getElementById('addMaxMarks').value)||100,description:document.getElementById('addDescription').value.trim(),resultCount:0,status:'active',createdAtMs:Date.now()});closeModal('addModal');loadExams();showToast('✅ Exam created!','success');}catch(e){showToast('Failed to create exam.','error');}finally{btn.disabled=false;btn.textContent='Create Exam';}});

function openEditExam(id){selectedId=id;const e=exams.find(x=>x.id===id);if(!e)return;document.getElementById('editName').value=e.name||'';document.getElementById('editBatch').value=e.batchId||'';document.getElementById('editDate').value=e.examDate||'';document.getElementById('editMaxMarks').value=e.maxMarks||'';document.getElementById('editDescription').value=e.description||'';document.getElementById('editModal').classList.add('show');}
document.getElementById('editForm').addEventListener('submit',async function(e){e.preventDefault();if(!selectedId||!session)return;const btn=this.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Saving...';try{const batchId=document.getElementById('editBatch').value;const batch=batches.find(b=>b.id===batchId);await db.collection('institutes').doc(session.instituteId).collection('exams').doc(selectedId).update({name:document.getElementById('editName').value.trim(),batchId,batchName:batch?.name||'Unknown',examDate:document.getElementById('editDate').value||null,maxMarks:parseInt(document.getElementById('editMaxMarks').value)||100,description:document.getElementById('editDescription').value.trim()});const idx=exams.findIndex(x=>x.id===selectedId);if(idx!==-1)Object.assign(exams[idx],{name:document.getElementById('editName').value.trim(),batchName:batch?.name||'Unknown'});closeModal('editModal');renderExams();showToast('✅ Exam updated!','success');}catch(e){showToast('Failed to update.','error');}finally{btn.disabled=false;btn.textContent='Save';}});

async function openAddResults(id){editingResultExamId=id;const e=exams.find(x=>x.id===id);if(!e)return;document.getElementById('resultExamInfo').textContent=`${esc(e.name||'Exam')} — ${esc(e.batchName||'')} (Max: ${e.maxMarks||100})`;await loadStudents();const list=document.getElementById('resultList');if(!students.length){list.innerHTML='<p style="text-align:center;color:var(--gray-400);padding:20px;">No students enrolled.</p>';document.getElementById('resultModal').classList.add('show');return;}
let existingResults=[];try{const snap=await db.collection('institutes').doc(session.instituteId).collection('results').where('examId','==',id).get();snap.forEach(d=>existingResults.push(d.data()));}catch(e){}
list.innerHTML=students.map((s,i)=>{const existing=existingResults.find(r=>r.studentId===s.id);return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:${i%2===0?'var(--gray-50)':'transparent'};border-radius:6px;margin-bottom:4px;"><span style="font-weight:500;font-size:14px;flex:1;">${esc(s.fullName||'—')}</span><input type="number" class="form-input result-input" data-student-id="${s.id}" data-student-name="${esc(s.fullName||'')}" placeholder="Marks" min="0" max="${e.maxMarks||100}" value="${existing?existing.marksObtained:''}" style="width:100px;padding:6px 10px;"></div>`;}).join('');
document.getElementById('resultModal').classList.add('show');}

async function saveResults(){if(!editingResultExamId||!session)return;const inputs=document.querySelectorAll('.result-input');const results=[];inputs.forEach(inp=>{const val=inp.value.trim();if(val!=='')results.push({examId:editingResultExamId,studentId:inp.dataset.studentId,studentName:inp.dataset.studentName,marksObtained:parseFloat(val),createdAtMs:Date.now()});});if(!results.length){showToast('Enter at least one mark.','error');return;}
try{const batch=firebase.firestore().batch();const base=db.collection('institutes').doc(session.instituteId);results.forEach(r=>{const ref=base.collection('results').doc();batch.set(ref,r);});batch.commit();await base.collection('exams').doc(editingResultExamId).update({resultCount:results.length});const e=exams.find(x=>x.id===editingResultExamId);if(e)e.resultCount=results.length;closeModal('resultModal');renderExams();showToast(`✅ Saved ${results.length} results!`,'success');}catch(e){showToast('Failed to save results.','error');}}

function openDeleteExam(id){selectedId=id;document.getElementById('deleteModal').classList.add('show');}
async function confirmDeleteExam(){if(!selectedId||!session)return;try{await db.collection('institutes').doc(session.instituteId).collection('exams').doc(selectedId).delete();exams=exams.filter(x=>x.id!==selectedId);closeModal('deleteModal');renderExams();showToast('Exam deleted.','warning');}catch(e){showToast('Failed to delete.','error');}}

function closeModal(id){document.getElementById(id).classList.remove('show');selectedId=null;editingResultExamId=null;}
function showToast(m,t){const c=document.getElementById('toastContainer');const o=document.createElement('div');o.className='toast '+t;o.textContent=m;c.appendChild(o);setTimeout(()=>o.remove(),4000);}
function esc(str){if(!str)return '—';const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
</script></body></html>
