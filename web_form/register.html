<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Student registration | BatchFee</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #07111f; color: #f8fafc; padding: 24px 16px 40px; }
    main { width: min(100%, 520px); margin: 0 auto; }
    .card { border: 1px solid #1e293b; border-radius: 16px; background: #0f172a; box-shadow: 0 18px 45px rgb(0 0 0 / 18%); }
    header { padding: 28px 24px 24px; text-align: center; margin-bottom: 16px; }
    #logoWrap { width: 76px; height: 76px; margin: 0 auto 14px; overflow: hidden; border-radius: 50%; border: 2px solid rgb(34 211 238 / 35%); background: #111827; }
    #logoWrap[hidden] { display: none; }
    #instituteLogo { display: block; width: 100%; height: 100%; object-fit: cover; }
    .eyebrow { margin: 0 0 9px; color: #22d3ee; font-weight: 700; font-size: .71rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.3rem, 5vw, 1.65rem); line-height: 1.25; }
    #institutePhone { margin: 8px 0 0; min-height: 1.1em; color: #94a3b8; font-size: .94rem; }
    #institutePhone:empty { display: none; }
    #formCard { padding: 24px; }
    .notice { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: .82rem; font-weight: 650; }
    .required { color: #f87171; }
    input, select, textarea { width: 100%; min-height: 46px; border: 1px solid #334155; border-radius: 10px; padding: 11px 12px; color: #f8fafc; background: #07111f; font: inherit; }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgb(34 211 238 / 35%); outline-offset: 1px; border-color: #22d3ee; }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: #f87171; }
    .error { display: none; margin: 6px 0 0; color: #fca5a5; font-size: .8rem; line-height: 1.35; }
    .error.visible { display: block; }
    button { width: 100%; min-height: 48px; margin-top: 8px; border: 0; border-radius: 11px; color: #fff; background: linear-gradient(135deg, #2563eb, #06b6d4); font: inherit; font-weight: 750; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    .status { margin: 0 0 16px; padding: 12px; border: 1px solid #334155; border-radius: 10px; color: #cbd5e1; line-height: 1.45; font-size: .9rem; }
    .status[hidden] { display: none; }
    .status.error-state { color: #fecaca; border-color: rgb(248 113 113 / 65%); background: rgb(127 29 29 / 22%); }
    .status.success-state { color: #bbf7d0; border-color: rgb(74 222 128 / 55%); background: rgb(20 83 45 / 28%); }
    .honeypot { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    footer { margin-top: 18px; color: #64748b; text-align: center; font-size: .76rem; }
  </style>
</head>
<body>
  <main>
    <header class="card">
      <div id="logoWrap" hidden><img id="instituteLogo" alt="Institute logo" referrerpolicy="no-referrer"></div>
      <p class="eyebrow">Official student registration</p>
      <h1 id="instituteName">Loading registration form…</h1>
      <p id="institutePhone"></p>
    </header>

    <section id="formCard" class="card" aria-live="polite">
      <p id="pageStatus" class="status">Verifying registration link…</p>
      <form id="registrationForm" hidden novalidate>
        <p class="notice">Fields marked <span class="required">*</span> are required. The institute reviews each submission before approving it.</p>
        <div class="field">
          <label for="fullName">Student name <span class="required">*</span></label>
          <input id="fullName" name="fullName" autocomplete="name" maxlength="120" required>
          <p id="fullNameError" class="error"></p>
        </div>
        <div class="field">
          <label for="phone">Mobile number <span class="required">*</span></label>
          <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="01712 345678" maxlength="18" required>
          <p id="phoneError" class="error"></p>
        </div>
        <div class="field">
          <label for="guardianName">Guardian name</label>
          <input id="guardianName" name="guardianName" autocomplete="section-parent name" maxlength="120">
          <p id="guardianNameError" class="error"></p>
        </div>
        <div class="field">
          <label for="whatsappNumber">WhatsApp number</label>
          <input id="whatsappNumber" name="whatsappNumber" inputmode="tel" autocomplete="tel" placeholder="01712 345678" maxlength="18">
          <p id="whatsappNumberError" class="error"></p>
        </div>
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <p id="genderError" class="error"></p>
        </div>
        <div class="field">
          <label for="dateOfBirth">Date of birth</label>
          <input id="dateOfBirth" name="dateOfBirth" type="date">
          <p id="dateOfBirthError" class="error"></p>
        </div>
        <div class="field">
          <label for="schoolName">School / institute name</label>
          <input id="schoolName" name="schoolName" maxlength="160">
          <p id="schoolNameError" class="error"></p>
        </div>
        <div class="field">
          <label for="className">Class</label>
          <input id="className" name="className" maxlength="80" placeholder="Example: Class 10">
          <p id="classNameError" class="error"></p>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <textarea id="address" name="address" maxlength="300"></textarea>
          <p id="addressError" class="error"></p>
        </div>
        <label class="honeypot" for="website">Leave this field empty</label>
        <input id="website" class="honeypot" name="website" tabindex="-1" autocomplete="off">
        <button id="submitButton" type="submit">Submit registration</button>
      </form>
    </section>
    <footer>Powered by BatchFee</footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script>
    (() => {
      "use strict";
      const firebaseConfig = {
        apiKey: "AIzaSyD5Ksi9vr0jJjD5cKZ4okpEKmBgK2OVzTI",
        authDomain: "batchfee-477b8.firebaseapp.com",
        projectId: "batchfee-477b8",
        appId: "1:632446580863:web:61dc55d96ede0dca3c674a"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
        db.useEmulator(location.hostname, 8180);
      }

      const form = document.getElementById("registrationForm");
      const status = document.getElementById("pageStatus");
      const button = document.getElementById("submitButton");
      let activeProfile = null;
      let formStartedAtMs = 0;

      function showStatus(message, kind = "") {
        status.textContent = message;
        status.hidden = false;
        status.className = `status ${kind}`.trim();
      }
      function hideStatus() { status.hidden = true; }
      function formValue(name) { return document.getElementById(name).value.trim(); }
      function clearErrors() {
        document.querySelectorAll(".error").forEach((item) => { item.textContent = ""; item.classList.remove("visible"); });
        document.querySelectorAll("[aria-invalid]").forEach((item) => item.removeAttribute("aria-invalid"));
      }
      function showFieldError(name, message) {
        const element = document.getElementById(name);
        const error = document.getElementById(`${name}Error`);
        if (element) element.setAttribute("aria-invalid", "true");
        if (error) { error.textContent = message; error.classList.add("visible"); }
      }
      function slugFromPath() {
        const match = location.pathname.match(/^\/register\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/);
        return match ? match[1] : null;
      }
      function registrationEndpoint() {
        // The Hosting rewrite is used in deployed previews and production. The
        // Functions emulator runs on its own port during local development.
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
          return `${location.protocol}//${location.hostname}:5001/batchfee-477b8/asia-south1/submitPublicRegistration`;
        }
        return "/api/register";
      }
      function legacyInstituteId() {
        const value = new URLSearchParams(location.search).get("instituteId");
        return value && /^[A-Za-z0-9_-]{1,128}$/.test(value) ? value : null;
      }
      function setLogo(value) {
        const wrapper = document.getElementById("logoWrap");
        const image = document.getElementById("instituteLogo");
        if (typeof value !== "string" || !/^https:\/\//i.test(value.trim())) {
          wrapper.hidden = true;
          image.removeAttribute("src");
          return;
        }
        image.onload = () => { wrapper.hidden = false; };
        image.onerror = () => { image.removeAttribute("src"); wrapper.hidden = true; };
        image.src = value.trim();
      }
      function renderProfile(profile) {
        activeProfile = profile;
        document.title = `Student registration | ${profile.instituteName}`;
        document.getElementById("instituteName").textContent = profile.instituteName;
        document.getElementById("institutePhone").textContent = profile.phone || "";
        setLogo(profile.profilePhotoUri);
        hideStatus();
        form.hidden = false;
        formStartedAtMs = Date.now();
      }
      function safeProfile(snapshot, expectedSlug) {
        if (!snapshot.exists) return null;
        const value = snapshot.data() || {};
        if (value.slug !== expectedSlug || typeof value.instituteName !== "string" || !value.instituteName.trim()) return null;
        return {
          slug: value.slug,
          instituteName: value.instituteName.trim(),
          phone: typeof value.phone === "string" ? value.phone.trim() : "",
          profilePhotoUri: typeof value.profilePhotoUri === "string" ? value.profilePhotoUri.trim() : ""
        };
      }
      async function loadProfile() {
        const slug = slugFromPath();
        try {
          if (slug) {
            const profile = safeProfile(await db.collection("public_registration_profiles").doc(slug).get(), slug);
            if (profile) { renderProfile(profile); return; }
          } else {
            const instituteId = legacyInstituteId();
            if (instituteId) {
              const legacy = (await db.collection("public_registration_profiles").doc(`id_${instituteId}`).get()).data();
              const legacySlug = legacy && typeof legacy.slug === "string" ? legacy.slug : "";
              if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(legacySlug)) {
                location.replace(`/register/${encodeURIComponent(legacySlug)}`);
                return;
              }
            }
          }
          document.getElementById("instituteName").textContent = "Registration link unavailable";
          showStatus("This registration link is invalid, expired, or no longer available. Please contact the institute.", "error-state");
        } catch (_) {
          document.getElementById("instituteName").textContent = "Registration link unavailable";
          showStatus("We could not verify this registration link. Please check your connection and try again.", "error-state");
        }
      }
      function clientValidate(payload) {
        clearErrors();
        let valid = true;
        if (payload.fullName.length < 2) { showFieldError("fullName", "Enter the student's full name."); valid = false; }
        const compactPhone = payload.phone.replace(/[\s()-]/g, "").replace(/^\+?880/, "").replace(/^0/, "");
        if (!/^1[3-9][0-9]{8}$/.test(compactPhone)) { showFieldError("phone", "Enter a valid Bangladesh mobile number."); valid = false; }
        if (payload.whatsappNumber) {
          const compactWhatsapp = payload.whatsappNumber.replace(/[\s()-]/g, "").replace(/^\+?880/, "").replace(/^0/, "");
          if (!/^1[3-9][0-9]{8}$/.test(compactWhatsapp)) { showFieldError("whatsappNumber", "Enter a valid Bangladesh mobile number."); valid = false; }
        }
        return valid;
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!activeProfile) return;
        const payload = {
          slug: activeProfile.slug,
          fullName: formValue("fullName"),
          phone: formValue("phone"),
          guardianName: formValue("guardianName"),
          whatsappNumber: formValue("whatsappNumber"),
          gender: document.getElementById("gender").value,
          dateOfBirth: document.getElementById("dateOfBirth").value,
          schoolName: formValue("schoolName"),
          className: formValue("className"),
          address: formValue("address"),
          website: document.getElementById("website").value,
          startedAtMs: formStartedAtMs
        };
        if (!clientValidate(payload)) return;
        button.disabled = true;
        button.textContent = "Submitting…";
        try {
          const response = await fetch(registrationEndpoint(), {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(payload),
            credentials: "same-origin"
          });
          const result = await response.json().catch(() => ({}));
          if (response.ok && result.status === "accepted") {
            form.reset();
            form.hidden = true;
            showStatus("Registration submitted successfully. The institute will review your information and contact you if needed.", "success-state");
            return;
          }
          const messages = {
            validation_failed: "Please review the highlighted information and try again.",
            already_submitted: "A registration with this mobile number was already submitted recently.",
            try_again_later: "Too many attempts from this connection. Please wait and try again later.",
            registration_link_not_found: "This registration link is no longer available.",
            temporarily_unavailable: "The registration service is temporarily unavailable. Please try again shortly."
          };
          showStatus(messages[result.error] || "We could not submit the registration. Please try again.", "error-state");
        } catch (_) {
          showStatus("We could not submit the registration. Check your connection and try again.", "error-state");
        } finally {
          button.disabled = false;
          button.textContent = "Submit registration";
        }
      });
      loadProfile();
    })();
  </script>
</body>
</html>
